<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1524"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <radialGradient id="radialGlow" cx="42%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151E2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E1624" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Leaf 1 (Top) Gradient: Lime to Fresh Green -->
    <linearGradient id="leafA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Leaf 2 (Right) Gradient: Emerald to Teal -->
    <linearGradient id="leafB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Leaf 3 (Left) Gradient: Forest to Deep Emerald -->
    <linearGradient id="leafC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glow Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="leafGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; }
    .text-body { font-family: 'Inter', system-ui, sans-serif; }
    .card-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; font-size: 16px; }
    .card-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.45; fill: #94A3B8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#radialGlow)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(60, 48)">
    <!-- Small Logo Icon -->
    <circle cx="20" cy="20" r="18" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#10B981"/>

    <text x="50" y="25" class="title-main" font-size="22" letter-spacing="-0.5">
      SWMS <tspan fill="#10B981">Brand Identity</tspan>
    </text>
    <text x="270" y="24" class="text-body" font-size="14" fill="#64748B" font-weight="600">
      | &nbsp; Filosofi &amp; Anatomi Simbolisme Logo
    </text>

    <!-- Top-Right Tag -->
    <rect x="870" y="4" width="210" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <circle cx="886" cy="19" r="4" fill="#10B981"/>
    <text x="898" y="24" class="text-body" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">
      TRI-RADIAL BOTANICAL LOOP
    </text>
  </g>

  <line x1="60" y1="96" x2="1140" y2="96" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- ==================== CENTRAL LOGO DISPLAY (ORBITAL GUIDE) ==================== -->
  <g transform="translate(500, 375)">
    <!-- Concentric Technical Compass / Orbit Rings -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

    <!-- Degree Lines (0°, 120°, 240°) -->
    <line x1="0" y1="0" x2="0" y2="-170" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="147" y2="85" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="0" y1="0" x2="-147" y2="85" stroke="rgba(5, 150, 105, 0.3)" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Center Soft Radial Shield -->
    <circle cx="0" cy="0" r="115" fill="rgba(8, 12, 20, 0.75)" filter="url(#shadow)"/>

    <!-- The 3 Botanical Leaves with Shadows and Inner Ribs -->
    <g filter="url(#leafGlow)">
      <!-- Leaf 1 (Top, 0 deg) -->
      <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" fill="url(#leafA)"/>
      <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" fill="#15803D" opacity="0.35"/>

      <!-- Leaf 2 (Bottom Right, 120 deg) -->
      <g transform="rotate(120)">
        <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" fill="url(#leafB)"/>
        <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" fill="#047857" opacity="0.35"/>
      </g>

      <!-- Leaf 3 (Bottom Left, 240 deg) -->
      <g transform="rotate(240)">
        <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" fill="url(#leafC)"/>
        <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" fill="#064E3B" opacity="0.35"/>
      </g>
    </g>

    <!-- Center Pivot Core -->
    <circle cx="0" cy="0" r="16" fill="#090D16" stroke="#10B981" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#34D399"/>
  </g>

  <!-- ==================== CALLOUT POINTER LINES ==================== -->
  <!-- Line 1 to Top-Left Card -->
  <path d="M 490, 290 L 440, 210 L 380, 210" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <circle cx="490" cy="290" r="4" fill="#4ADE80"/>

  <!-- Line 2 to Top-Right Card -->
  <path d="M 580, 420 L 710, 310 L 760, 310" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <circle cx="580" cy="420" r="4" fill="#10B981"/>

  <!-- Line 3 to Bottom-Left Card -->
  <path d="M 425, 420 L 370, 490 L 330, 490" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <circle cx="425" cy="420" r="4" fill="#059669"/>

  <!-- Line 4 to Center Core (Bottom-Right Card) -->
  <path d="M 500, 375 L 670, 520 L 760, 520" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <circle cx="500" cy="375" r="4" fill="#38BDF8"/>

  <!-- ==================== PHILOSOPHY CARDS ==================== -->

  <!-- CARD 1: DAUN 1 - CITIZEN PARTICIPATION (Top Left) -->
  <g transform="translate(60, 135)" filter="url(#shadow)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="10" fill="rgba(74, 222, 128, 0.15)"/>
    <text x="35" y="41" font-size="18" text-anchor="middle">🌱</text>
    
    <text x="64" y="34" class="card-title" fill="#4ADE80">1. Partisipasi Warga</text>
    <text x="64" y="49" class="text-body" font-size="11" font-weight="700" fill="#86EFAC">CITIZEN ACTION &amp; GROWTH</text>

    <text x="20" y="80" class="card-desc">
      <tspan x="20" dy="0">Daun atas bersudut 0° dengan gradasi hijau</tspan>
      <tspan x="20" dy="18">muda cerah melambangkan inisiatif warga,</tspan>
      <tspan x="20" dy="18">kepedulian masyarakat, dan pelaporan awal</tspan>
      <tspan x="20" dy="18">timbunan sampah secara partisipatif.</tspan>
    </text>
  </g>

  <!-- CARD 2: DAUN 2 - AI INTELLIGENCE (Top Right) -->
  <g transform="translate(760, 235)" filter="url(#shadow)">
    <rect width="380" height="150" rx="16" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="35" y="41" font-size="18" text-anchor="middle">⚡</text>
    
    <text x="64" y="34" class="card-title" fill="#34D399">2. Kecerdasan Buatan (AI)</text>
    <text x="64" y="49" class="text-body" font-size="11" font-weight="700" fill="#6EE7B7">MOBILENETV2 COMPUTER VISION</text>

    <text x="20" y="80" class="card-desc">
      <tspan x="20" dy="0">Daun kanan (120°) bernuansa emerald cerah</tspan>
      <tspan x="20" dy="18">merepresentasikan inferensi machine learning</tspan>
      <tspan x="20" dy="18">presisi tinggi (92.8% akurasi) dalam memilah</tspan>
      <tspan x="20" dy="18">kategori sampah secara otomatis seketika.</tspan>
    </text>
  </g>

  <!-- CARD 3: DAUN 3 - SANITATION FLEET & SUSTAINABILITY (Bottom Left) -->
  <g transform="translate(60, 415)" filter="url(#shadow)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="rgba(5, 150, 105, 0.4)" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="10" fill="rgba(5, 150, 105, 0.2)"/>
    <text x="35" y="41" font-size="18" text-anchor="middle">🚛</text>
    
    <text x="64" y="34" class="card-title" fill="#10B981">3. Armada &amp; Penanganan</text>
    <text x="64" y="49" class="text-body" font-size="11" font-weight="700" fill="#34D399">MUNICIPAL FLEET LOGISTICS</text>

    <text x="20" y="80" class="card-desc">
      <tspan x="20" dy="0">Daun kiri (240°) berwarna hijau hutan kokoh</tspan>
      <tspan x="20" dy="18">melambangkan kesiapan armada petugas DLH</tspan>
      <tspan x="20" dy="18">dalam menindaklanjuti laporan hingga tuntas</tspan>
      <tspan x="20" dy="18">ke tempat pemrosesan akhir (TPST).</tspan>
    </text>
  </g>

  <!-- CARD 4: PUSAT SINERGI & SIKLUS SIRKULAR (Bottom Right) -->
  <g transform="translate(760, 445)" filter="url(#shadow)">
    <rect width="380" height="150" rx="16" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="35" y="41" font-size="18" text-anchor="middle">♻️</text>
    
    <text x="64" y="34" class="card-title" fill="#38BDF8">4. Titik Inti &amp; Ekonomi Sirkular</text>
    <text x="64" y="49" class="text-body" font-size="11" font-weight="700" fill="#7DD3FC">CIRCULAR ZERO-WASTE LOOP</text>

    <text x="20" y="80" class="card-desc">
      <tspan x="20" dy="0">Pusat rotasi 3-sumbu berbentuk kurva Möbius</tspan>
      <tspan x="20" dy="18">menyiratkan siklus nir-putus (Reduce-Reuse-Recycle).</tspan>
      <tspan x="20" dy="18">Titik pusat adalah integrasi harmonis antara Warga,</tspan>
      <tspan x="20" dy="18">Teknologi Cerdas, dan Regulasi Pemerintah.</tspan>
    </text>
  </g>

  <!-- Footer Citation -->
  <text x="600" y="650" class="text-body" font-size="11" fill="#475569" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    SWMS Eco-Tech Urban Platform · Designed for Bilcode Technology Technical Assessment · 2026
  </text>
</svg>
