<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>SWMS Botanical 3-Leaf Cycle Mark</title>
  <defs>
    <linearGradient id="swmsLeafA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="swmsLeafB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="swmsLeafC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- SWMS Botanical 3-Leaf Recycling Cycle -->
  <g transform="translate(128,128)">
    <!-- Leaf 1 (Top) -->
    <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" 
          fill="url(#swmsLeafA)"/>
    <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" 
          fill="#15803D" opacity="0.3"/>

    <!-- Leaf 2 (Bottom Right, 120deg) -->
    <g transform="rotate(120)">
      <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" 
            fill="url(#swmsLeafB)"/>
      <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" 
            fill="#065F46" opacity="0.3"/>
    </g>

    <!-- Leaf 3 (Bottom Left, 240deg) -->
    <g transform="rotate(240)">
      <path d="M 0,-104 C 42,-104 84,-72 84,-24 C 84,16 54,48 16,62 C 34,36 38,10 32,-16 C 26,-42 12,-74 0,-104 Z" 
            fill="url(#swmsLeafC)"/>
      <path d="M 0,-104 C 18,-70 24,-40 20,-10 C 18,12 8,34 -4,50 C 8,36 14,18 14,-4 C 14,-28 8,-66 0,-104 Z" 
            fill="#047857" opacity="0.4"/>
    </g>

    <!-- Center Seed of Sustainability -->
    <circle cx="0" cy="0" r="9" fill="#10B981"/>
  </g>
</svg>
