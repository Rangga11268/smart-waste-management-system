<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c4-title c4-desc" viewBox="0 0 1060 620" width="1060" height="620">
  <title id="c4-title">C4 Container Architecture of SWMS</title>
  <desc id="c4-desc">System container diagram showing presentation clients, FastAPI application gateway, PyTorch inference engine, PostgreSQL database, and static file storage.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .zone-title {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #475569;
      }
      .node-title {
        font-size: 14px;
        font-weight: 600;
        fill: #0f172a;
      }
      .node-tag {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .node-desc {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10.5px;
        fill: #475569;
      }
      .arrow-label {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        fill: #0f172a;
      }
      .legend-text {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        fill: #475569;
      }
    </style>

    <!-- Marker Default Muted -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <!-- Marker Accent Emerald -->
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <!-- Marker Link Blue -->
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>

    <!-- Dotted background pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#dot-grid)" opacity="0.6"/>

  <!-- ================= ZONES ================= -->
  <!-- Zone 1: Presentation Layer -->
  <rect x="30" y="30" width="1000" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="50" y="55" class="zone-title">1. Presentation Layer (Decoupled Clients)</text>

  <!-- Zone 2: Application & AI Engine Layer -->
  <rect x="30" y="195" width="1000" height="175" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="50" y="220" class="zone-title">2. Application &amp; AI Engine Layer (FastAPI Core)</text>

  <!-- Zone 3: Data & Persistence Layer -->
  <rect x="30" y="400" width="1000" height="145" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="50" y="425" class="zone-title">3. Data &amp; Persistence Layer</text>

  <!-- ================= CONNECTORS ================= -->
  <!-- Mobile -> FastAPI (Citizen Reporting) -->
  <path d="M 220 145 L 220 270 L 302 270" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-link)"/>
  <rect x="180" y="196" width="130" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="245" y="210" text-anchor="middle" class="arrow-label" fill="#0284c7">POST /predict &amp; /reports</text>

  <!-- Web -> FastAPI (Admin Triage & Stats) -->
  <path d="M 780 145 L 780 270 L 708 270" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-link)"/>
  <rect x="715" y="196" width="130" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="780" y="210" text-anchor="middle" class="arrow-label" fill="#0284c7">GET /stats &amp; PATCH /status</text>

  <!-- FastAPI -> PyTorch In-Process Call -->
  <line x1="600" y1="285" x2="728" y2="285" stroke="#059669" stroke-width="1.75" marker-end="url(#arrow-accent)" />
  <rect x="618" y="275" width="94" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="665" y="288" text-anchor="middle" class="arrow-label" fill="#059669">IN-MEMORY CALL</text>

  <!-- FastAPI -> PostgreSQL -->
  <path d="M 420 340 L 420 442" fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
  <rect x="350" y="375" width="140" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="420" y="388" text-anchor="middle" class="arrow-label">SQLAlchemy Connection</text>

  <!-- FastAPI -> Media Storage -->
  <path d="M 550 340 L 550 370 Q 550 376 556 376 L 774 376 Q 780 376 780 382 L 780 442" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <rect x="615" y="367" width="105" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="667" y="380" text-anchor="middle" class="arrow-label">Static File Write</text>

  <!-- ================= NODES ================= -->
  <!-- Node 1: Mobile App (Flutter) -->
  <g transform="translate(80, 68)">
    <rect width="300" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="84" height="16" rx="2" fill="#eff6ff" />
    <text x="18" y="22" class="node-tag" fill="#0284c7">MOBILE CLIENT</text>
    <text x="12" y="44" class="node-title">Citizen Mobile App (Flutter)</text>
    <text x="12" y="62" class="node-desc">Camera, GPS Geotagging, Real-time status</text>
  </g>

  <!-- Node 2: Web Portal (Next.js 14) -->
  <g transform="translate(680, 68)">
    <rect width="310" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="76" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="22" class="node-tag" fill="#334155">WEB PORTAL</text>
    <text x="12" y="44" class="node-title">Admin Dashboard (Next.js 14)</text>
    <text x="12" y="62" class="node-desc">Analytics stats, Filterable reports, Audit trail</text>
  </g>

  <!-- Node 3: Core Backend (FastAPI) [FOCAL NODE 1] -->
  <g transform="translate(310, 235)">
    <rect width="290" height="104" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
    <rect x="14" y="12" width="112" height="18" rx="2" fill="#059669" />
    <text x="20" y="25" class="node-tag" fill="#ffffff">FASTAPI CORE ENGINE</text>
    <text x="14" y="52" class="node-title" fill="#065f46" font-size="15">Core Backend (Python 3.12)</text>
    <text x="14" y="72" class="node-desc">Async REST Gateway · JWT RBAC (Admin/User)</text>
    <text x="14" y="88" class="node-desc">Pydantic v2 Contracts · Report Lifecycle Logic</text>
  </g>

  <!-- Node 4: ML Engine (PyTorch MobileNetV2) [FOCAL NODE 2] -->
  <g transform="translate(730, 243)">
    <rect width="260" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="108" height="16" rx="2" fill="#fff7ed" />
    <text x="18" y="22" class="node-tag" fill="#c2410c">PYTORCH INFERENCE</text>
    <text x="12" y="44" class="node-title">MobileNetV2 Classifier</text>
    <text x="12" y="62" class="node-desc">In-Memory Model (waste_model.pth)</text>
    <text x="12" y="76" class="node-desc">Organic, Plastic, Paper (92.86% Acc)</text>
  </g>

  <!-- Node 5: PostgreSQL Database -->
  <g transform="translate(240, 445)">
    <rect width="360" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="86" height="16" rx="2" fill="#f1f5f9" />
    <text x="18" y="22" class="node-tag" fill="#475569">PRIMARY STORE</text>
    <text x="12" y="44" class="node-title">PostgreSQL 16 (Neon / Supabase)</text>
    <text x="12" y="64" class="node-desc">users, categories, waste_reports, immutable report_logs</text>
  </g>

  <!-- Node 6: Static File Storage -->
  <g transform="translate(680, 445)">
    <rect width="310" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="80" height="16" rx="2" fill="#f1f5f9" />
    <text x="18" y="22" class="node-tag" fill="#475569">MEDIA REPO</text>
    <text x="12" y="44" class="node-title">Static Storage (/uploads)</text>
    <text x="12" y="64" class="node-desc">Evidence photos repository with unique UUID paths</text>
  </g>

  <!-- ================= LEGEND STRIP ================= -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="980" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="20" cy="15" r="4" fill="#059669"/>
    <text x="30" y="19" class="legend-text">Core Application (FastAPI Focal)</text>

    <circle cx="240" cy="15" r="4" fill="#0284c7"/>
    <text x="250" y="19" class="legend-text">Client HTTP REST / Multipart</text>

    <circle cx="450" cy="15" r="4" fill="#c2410c"/>
    <text x="460" y="19" class="legend-text">PyTorch Transfer Learning</text>

    <line x1="640" y1="15" x2="665" y2="15" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="675" y="19" class="legend-text">Async / Storage IO</text>

    <circle cx="830" cy="15" r="4" fill="#64748b"/>
    <text x="840" y="19" class="legend-text">Persistence Engine</text>
  </g>
</svg>
