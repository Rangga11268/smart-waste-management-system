<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-title deploy-desc" viewBox="0 0 1060 620" width="1060" height="620">
  <title id="deploy-title">Deployment Topology of SWMS</title>
  <desc id="deploy-desc">Infrastructure deployment topology showing edge clients, Vercel frontend, Dockerized FastAPI compute container on Railway/Render, and Neon managed PostgreSQL.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .tier-title {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #475569;
      }
      .node-title {
        font-size: 14px;
        font-weight: 600;
        fill: #0f172a;
      }
      .node-tag {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .node-desc {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10.5px;
        fill: #475569;
      }
      .arrow-label {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        fill: #0f172a;
      }
      .legend-text {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        fill: #475569;
      }
    </style>
    <marker id="dp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="dp-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="dp-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <pattern id="dot-grid-deploy" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#dot-grid-deploy)" opacity="0.6"/>

  <!-- ================= TIERS / CLOUD ZONES ================= -->
  <!-- Tier 1: Client Edge (Devices) -->
  <rect x="40" y="30" width="980" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="60" y="55" class="tier-title">1. Edge Devices &amp; Client Run-times</text>

  <!-- Tier 2: Cloud Compute & Hosting -->
  <rect x="40" y="190" width="980" height="190" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="60" y="215" class="tier-title">2. Application Compute &amp; Edge Delivery</text>

  <!-- Tier 3: Managed Data Services -->
  <rect x="40" y="420" width="980" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="60" y="445" class="tier-title">3. Managed Cloud Persistence</text>

  <!-- ================= CONNECTORS ================= -->
  <!-- Admin Workstation -> Vercel Edge -->
  <path d="M 800 130 L 800 232" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#dp-link)"/>
  <rect x="740" y="170" width="120" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="184" text-anchor="middle" class="arrow-label" fill="#0284c7">HTTPS Web Traffic</text>

  <!-- Citizen Device -> FastAPI Backend -->
  <path d="M 240 130 L 240 285 Q 240 290 246 290 L 372 290" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#dp-link)"/>
  <rect x="185" y="200" width="130" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="214" text-anchor="middle" class="arrow-label" fill="#0284c7">HTTPS Multipart / API</text>

  <!-- Vercel Frontend -> FastAPI Backend -->
  <path d="M 680 290 L 638 290" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#dp-link)"/>
  <rect x="642" y="265" width="70" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="677" y="278" text-anchor="middle" class="arrow-label" fill="#0284c7">REST API</text>

  <!-- FastAPI Backend -> PostgreSQL (Neon) -->
  <path d="M 450 345 L 450 460" fill="none" stroke="#059669" stroke-width="1.75" marker-end="url(#dp-green)"/>
  <rect x="380" y="390" width="140" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="404" text-anchor="middle" class="arrow-label" fill="#059669">TLS Port 5432 / Pool</text>

  <!-- FastAPI Backend -> Persistent Volume (/uploads) -->
  <path d="M 550 345 L 550 460" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dp-ar)"/>
  <rect x="520" y="390" width="100" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="570" y="404" text-anchor="middle" class="arrow-label">Mount Volume</text>

  <!-- ================= NODES ================= -->
  <!-- Node 1: Citizen Mobile Device -->
  <g transform="translate(90, 68)">
    <rect width="300" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="84" height="15" rx="2" fill="#eff6ff" />
    <text x="18" y="21" class="node-tag" fill="#0284c7">ANDROID DEVICE</text>
    <text x="12" y="42" class="node-title">Citizen Phone (Flutter Release APK)</text>
    <text x="12" y="55" class="node-desc">geolocator GPS + camera pipeline</text>
  </g>

  <!-- Node 2: Admin Workstation -->
  <g transform="translate(650, 68)">
    <rect width="300" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="96" height="15" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="21" class="node-tag" fill="#334155">ADMIN WORKSTATION</text>
    <text x="12" y="42" class="node-title">Municipal Operator Browser</text>
    <text x="12" y="55" class="node-desc">Chrome / Edge desktop browser</text>
  </g>

  <!-- Node 3: FastAPI Compute Container [FOCAL] -->
  <g transform="translate(380, 235)">
    <rect width="250" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
    <rect x="12" y="12" width="115" height="16" rx="2" fill="#059669" />
    <text x="18" y="24" class="node-tag" fill="#ffffff">RAILWAY / RENDER</text>
    <text x="12" y="50" class="node-title" fill="#065f46">FastAPI Docker Container</text>
    <text x="12" y="70" class="node-desc">Python 3.12 · Uvicorn ASGI Server</text>
    <text x="12" y="85" class="node-desc">PyTorch CPU Inference · Lifespan RAM</text>
    <text x="12" y="100" class="node-desc">CORS &amp; JWT Verification</text>
  </g>

  <!-- Node 4: Vercel Edge Frontend -->
  <g transform="translate(680, 245)">
    <rect width="270" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="80" height="15" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="21" class="node-tag" fill="#334155">VERCEL EDGE</text>
    <text x="12" y="42" class="node-title">Next.js 14 Web Portal</text>
    <text x="12" y="60" class="node-desc">Global Edge CDN Distribution</text>
    <text x="12" y="75" class="node-desc">Static Shell + Client App Router</text>
  </g>

  <!-- Node 5: PostgreSQL Database -->
  <g transform="translate(290, 460)">
    <rect width="280" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="90" height="15" rx="2" fill="#f1f5f9" />
    <text x="18" y="21" class="node-tag" fill="#475569">SERVERLESS DB</text>
    <text x="12" y="42" class="node-title">Neon.tech / Supabase</text>
    <text x="12" y="60" class="node-desc">PostgreSQL 16 · SSL Connection Pooling</text>
  </g>

  <!-- Node 6: Persistent File Volume -->
  <g transform="translate(630, 460)">
    <rect width="260" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="12" y="10" width="94" height="15" rx="2" fill="#f1f5f9" />
    <text x="18" y="21" class="node-tag" fill="#475569">PERSISTENT DISK</text>
    <text x="12" y="42" class="node-title">Uploads Volume (/uploads)</text>
    <text x="12" y="60" class="node-desc">Mounted Storage for Evidence Photos</text>
  </g>

  <!-- ================= LEGEND STRIP ================= -->
  <g transform="translate(40, 575)">
    <rect x="0" y="0" width="980" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="20" cy="15" r="4" fill="#059669"/>
    <text x="30" y="19" class="legend-text">Core Application Engine (Containerized)</text>

    <circle cx="280" cy="15" r="4" fill="#0284c7"/>
    <text x="290" y="19" class="legend-text">Public Ingress / HTTPS TLS Traffic</text>

    <circle cx="530" cy="15" r="4" fill="#475569"/>
    <text x="540" y="19" class="legend-text">Managed Persistence (Cloud DB &amp; Volume)</text>

    <line x1="790" y1="15" x2="815" y2="15" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="825" y="19" class="legend-text">Local Container Volume Mount</text>
  </g>
</svg>
