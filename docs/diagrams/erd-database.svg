<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erd-title erd-desc" viewBox="0 0 1120 720" width="1120" height="720">
  <title id="erd-title">Entity-Relationship Diagram for SWMS Database</title>
  <desc id="erd-desc">Database schema diagram depicting users, categories, waste_reports, and report_logs entities with foreign keys, data types, and cardinalities.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .table-title {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .field-name {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #1e293b;
      }
      .field-type {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        fill: #64748b;
      }
      .key-badge {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 8.5px;
        font-weight: 700;
      }
      .rel-label {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        fill: #0f172a;
      }
      .cardinality {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #059669;
      }
      .legend-text {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        fill: #475569;
      }
    </style>
    <marker id="crow-many" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 M 9 1 L 9 9" fill="none" stroke="#059669" stroke-width="1.5" />
    </marker>
    <pattern id="dot-grid-erd" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#dot-grid-erd)" opacity="0.6"/>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->
  <!-- Rel 1: users (1) -> waste_reports (N) [Submits] -->
  <path d="M 350 150 L 420 150 Q 426 150 426 156 L 426 234 Q 426 240 432 240 L 488 240" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#crow-many)"/>
  <rect x="382" y="180" width="88" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="426" y="194" text-anchor="middle" class="rel-label">submits</text>
  <text x="360" y="144" class="cardinality">1</text>
  <text x="475" y="234" class="cardinality">0..N</text>

  <!-- Rel 2: categories (1) -> waste_reports (N) [Classifies] -->
  <path d="M 195 595 L 195 640 Q 195 646 201 646 L 424 646 Q 430 646 430 640 L 430 386 Q 430 380 436 380 L 488 380" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#crow-many)"/>
  <rect x="386" y="520" width="88" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="534" text-anchor="middle" class="rel-label">classifies</text>
  <text x="205" y="615" class="cardinality">1</text>
  <text x="475" y="374" class="cardinality">0..N</text>

  <!-- Rel 3: waste_reports (1) -> report_logs (N) [Has History] -->
  <path d="M 820 240 L 888 240" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#crow-many)"/>
  <rect x="830" y="222" width="50" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="855" y="235" text-anchor="middle" class="rel-label">logs</text>
  <text x="828" y="234" class="cardinality">1</text>
  <text x="874" y="234" class="cardinality">1..N</text>

  <!-- Rel 4: users (1) -> report_logs (N) [Actor Moderator] -->
  <path d="M 200 60 L 200 35 Q 200 30 206 30 L 994 30 Q 1000 30 1000 36 L 1000 108" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#crow-many)"/>
  <rect x="560" y="20" width="110" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="615" y="34" text-anchor="middle" class="rel-label" fill="#64748b">acts_on (audit)</text>

  <!-- ================= ENTITY TABLE 1: USERS ================= -->
  <g transform="translate(50, 60)">
    <rect width="300" height="268" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="300" height="34" rx="6" fill="#f1f5f9" />
    <rect y="28" width="300" height="6" fill="#f1f5f9" />
    <text x="14" y="22" class="table-title" fill="#0f172a">USERS</text>
    <text x="245" y="22" class="field-type" font-weight="600">auth_account</text>
    <line x1="0" y1="34" x2="300" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="12" y="44" width="22" height="15" rx="2" fill="#fef3c7"/>
    <text x="16" y="55" class="key-badge" fill="#b45309">PK</text>
    <text x="42" y="56" class="field-name">id</text>
    <text x="210" y="56" class="field-type">UUID</text>
    <line x1="12" y1="67" x2="288" y2="67" stroke="#f1f5f9" stroke-width="1"/>

    <rect x="12" y="73" width="22" height="15" rx="2" fill="#eff6ff"/>
    <text x="16" y="84" class="key-badge" fill="#0284c7">UQ</text>
    <text x="42" y="85" class="field-name">email</text>
    <text x="210" y="85" class="field-type">VARCHAR(255)</text>
    <line x1="12" y1="96" x2="288" y2="96" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="114" class="field-name">password_hash</text>
    <text x="210" y="114" class="field-type">VARCHAR(255)</text>
    <line x1="12" y1="125" x2="288" y2="125" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="143" class="field-name">full_name</text>
    <text x="210" y="143" class="field-type">VARCHAR(150)</text>
    <line x1="12" y1="154" x2="288" y2="154" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="172" class="field-name">role</text>
    <text x="210" y="172" class="field-type">'admin' | 'user'</text>
    <line x1="12" y1="183" x2="288" y2="183" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="201" class="field-name">phone_number</text>
    <text x="210" y="201" class="field-type">VARCHAR(30)</text>
    <line x1="12" y1="212" x2="288" y2="212" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="230" class="field-name">is_active</text>
    <text x="210" y="230" class="field-type">BOOLEAN (true)</text>
    <line x1="12" y1="241" x2="288" y2="241" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="258" class="field-name">created_at</text>
    <text x="210" y="258" class="field-type">TIMESTAMPTZ</text>
  </g>

  <!-- ================= ENTITY TABLE 2: CATEGORIES ================= -->
  <g transform="translate(50, 395)">
    <rect width="290" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="290" height="34" rx="6" fill="#f1f5f9" />
    <rect y="28" width="290" height="6" fill="#f1f5f9" />
    <text x="14" y="22" class="table-title" fill="#0f172a">CATEGORIES</text>
    <text x="220" y="22" class="field-type" font-weight="600">master_data</text>
    <line x1="0" y1="34" x2="290" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="12" y="44" width="22" height="15" rx="2" fill="#fef3c7"/>
    <text x="16" y="55" class="key-badge" fill="#b45309">PK</text>
    <text x="42" y="56" class="field-name">id</text>
    <text x="200" y="56" class="field-type">SERIAL (INT)</text>
    <line x1="12" y1="67" x2="278" y2="67" stroke="#f1f5f9" stroke-width="1"/>

    <rect x="12" y="73" width="22" height="15" rx="2" fill="#eff6ff"/>
    <text x="16" y="84" class="key-badge" fill="#0284c7">UQ</text>
    <text x="42" y="85" class="field-name">slug</text>
    <text x="200" y="85" class="field-type">VARCHAR(50)</text>
    <line x1="12" y1="96" x2="278" y2="96" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="114" class="field-name">name</text>
    <text x="200" y="114" class="field-type">VARCHAR(100)</text>
    <line x1="12" y1="125" x2="278" y2="125" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="143" class="field-name">description</text>
    <text x="200" y="143" class="field-type">TEXT</text>
    <line x1="12" y1="154" x2="278" y2="154" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="172" class="field-name">badge_color</text>
    <text x="200" y="172" class="field-type">VARCHAR(20)</text>
    <line x1="12" y1="183" x2="278" y2="183" stroke="#f1f5f9" stroke-width="1"/>
    <circle cx="270" cy="170" r="5" fill="#059669"/>
  </g>

  <!-- ================= ENTITY TABLE 3: WASTE_REPORTS [FOCAL] ================= -->
  <g transform="translate(490, 80)">
    <rect width="330" height="490" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
    <rect width="330" height="36" rx="6" fill="#059669" />
    <rect y="30" width="330" height="6" fill="#059669" />
    <text x="14" y="24" class="table-title" fill="#ffffff">WASTE_REPORTS (CORE TRANSACTIONS)</text>
    <line x1="0" y1="36" x2="330" y2="36" stroke="#047857" stroke-width="1"/>

    <rect x="12" y="46" width="22" height="15" rx="2" fill="#fef3c7"/>
    <text x="16" y="57" class="key-badge" fill="#b45309">PK</text>
    <text x="42" y="58" class="field-name">id</text>
    <text x="230" y="58" class="field-type">UUID DEFAULT v4()</text>
    <line x1="12" y1="69" x2="318" y2="69" stroke="#d1fae5" stroke-width="1"/>

    <rect x="12" y="75" width="22" height="15" rx="2" fill="#e0e7ff"/>
    <text x="16" y="86" class="key-badge" fill="#4338ca">FK</text>
    <text x="42" y="87" class="field-name">user_id</text>
    <text x="230" y="87" class="field-type">UUID -> users(id)</text>
    <line x1="12" y1="98" x2="318" y2="98" stroke="#d1fae5" stroke-width="1"/>

    <rect x="12" y="104" width="22" height="15" rx="2" fill="#e0e7ff"/>
    <text x="16" y="115" class="key-badge" fill="#4338ca">FK</text>
    <text x="42" y="116" class="field-name">category_id</text>
    <text x="230" y="116" class="field-type">INT -> categories(id)</text>
    <line x1="12" y1="127" x2="318" y2="127" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="145" class="field-name">title</text>
    <text x="230" y="145" class="field-type">VARCHAR(200)</text>
    <line x1="12" y1="156" x2="318" y2="156" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="174" class="field-name">description</text>
    <text x="230" y="174" class="field-type">TEXT</text>
    <line x1="12" y1="185" x2="318" y2="185" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="203" class="field-name">image_url</text>
    <text x="230" y="203" class="field-type">VARCHAR(500)</text>
    <line x1="12" y1="214" x2="318" y2="214" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="232" class="field-name">detected_category</text>
    <text x="230" y="232" class="field-type">VARCHAR(100)</text>
    <line x1="12" y1="243" x2="318" y2="243" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="261" class="field-name">ai_confidence</text>
    <text x="230" y="261" class="field-type">REAL (0.00 - 1.00)</text>
    <line x1="12" y1="272" x2="318" y2="272" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="290" class="field-name">latitude, longitude</text>
    <text x="230" y="290" class="field-type">DOUBLE PRECISION</text>
    <line x1="12" y1="301" x2="318" y2="301" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="319" class="field-name">address_note</text>
    <text x="230" y="319" class="field-type">VARCHAR(255)</text>
    <line x1="12" y1="330" x2="318" y2="330" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="348" class="field-name" font-weight="700">status</text>
    <text x="230" y="348" class="field-type" fill="#047857" font-weight="600">Pending|Progress|...</text>
    <line x1="12" y1="359" x2="318" y2="359" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="377" class="field-name">admin_notes</text>
    <text x="230" y="377" class="field-type">TEXT</text>
    <line x1="12" y1="388" x2="318" y2="388" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="406" class="field-name">resolved_at</text>
    <text x="230" y="406" class="field-type">TIMESTAMPTZ</text>
    <line x1="12" y1="417" x2="318" y2="417" stroke="#d1fae5" stroke-width="1"/>

    <text x="42" y="435" class="field-name">created_at, updated_at</text>
    <text x="230" y="435" class="field-type">TIMESTAMPTZ</text>
    <line x1="12" y1="446" x2="318" y2="446" stroke="#d1fae5" stroke-width="1"/>

    <text x="14" y="470" class="field-type" font-size="9">INDEXES: user_id, category_id, status, created_at DESC</text>
  </g>

  <!-- ================= ENTITY TABLE 4: REPORT_LOGS ================= -->
  <g transform="translate(890, 110)">
    <rect width="210" height="260" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="34" rx="6" fill="#f8fafc" />
    <rect y="28" width="210" height="6" fill="#f8fafc" />
    <text x="14" y="22" class="table-title" fill="#0f172a">REPORT_LOGS</text>
    <line x1="0" y1="34" x2="210" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="12" y="44" width="22" height="15" rx="2" fill="#fef3c7"/>
    <text x="16" y="55" class="key-badge" fill="#b45309">PK</text>
    <text x="42" y="56" class="field-name">id</text>
    <text x="145" y="56" class="field-type">UUID</text>
    <line x1="12" y1="67" x2="198" y2="67" stroke="#f1f5f9" stroke-width="1"/>

    <rect x="12" y="73" width="22" height="15" rx="2" fill="#e0e7ff"/>
    <text x="16" y="84" class="key-badge" fill="#4338ca">FK</text>
    <text x="42" y="85" class="field-name">report_id</text>
    <text x="145" y="85" class="field-type">UUID</text>
    <line x1="12" y1="96" x2="198" y2="96" stroke="#f1f5f9" stroke-width="1"/>

    <rect x="12" y="102" width="22" height="15" rx="2" fill="#e0e7ff"/>
    <text x="16" y="113" class="key-badge" fill="#4338ca">FK</text>
    <text x="42" y="114" class="field-name">actor_id</text>
    <text x="145" y="114" class="field-type">UUID</text>
    <line x1="12" y1="125" x2="198" y2="125" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="143" class="field-name">prev_status</text>
    <text x="145" y="143" class="field-type">VARCHAR</text>
    <line x1="12" y1="154" x2="198" y2="154" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="172" class="field-name">new_status</text>
    <text x="145" y="172" class="field-type">VARCHAR</text>
    <line x1="12" y1="183" x2="198" y2="183" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="201" class="field-name">remarks</text>
    <text x="145" y="201" class="field-type">TEXT</text>
    <line x1="12" y1="212" x2="198" y2="212" stroke="#f1f5f9" stroke-width="1"/>

    <text x="42" y="230" class="field-name">created_at</text>
    <text x="145" y="230" class="field-type">TIMESTAMPTZ</text>
  </g>

  <!-- ================= LEGEND STRIP ================= -->
  <g transform="translate(40, 675)">
    <rect x="0" y="0" width="1040" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="18" y="8" width="18" height="14" rx="2" fill="#fef3c7"/>
    <text x="21" y="18" class="key-badge" fill="#b45309">PK</text>
    <text x="42" y="19" class="legend-text">Primary Key</text>

    <rect x="160" y="8" width="18" height="14" rx="2" fill="#e0e7ff"/>
    <text x="163" y="18" class="key-badge" fill="#4338ca">FK</text>
    <text x="184" y="19" class="legend-text">Foreign Key (Referential Integrity)</text>

    <rect x="420" y="8" width="18" height="14" rx="2" fill="#eff6ff"/>
    <text x="423" y="18" class="key-badge" fill="#0284c7">UQ</text>
    <text x="444" y="19" class="legend-text">Unique Constraint</text>

    <circle cx="650" cy="15" r="4" fill="#059669"/>
    <text x="660" y="19" class="legend-text">Transactional Core Table (waste_reports)</text>

    <line x1="890" y1="15" x2="920" y2="15" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="930" y="19" class="legend-text">Immutable Audit Trail</text>
  </g>
</svg>
