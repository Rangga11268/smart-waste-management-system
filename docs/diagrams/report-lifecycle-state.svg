<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc" viewBox="0 0 1060 560" width="1060" height="560">
  <title id="state-title">Waste Report State Machine Diagram</title>
  <desc id="state-desc">State machine diagram showing Pending, In Progress, Completed, and Rejected states with guard conditions and transitions.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .state-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .state-sub {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        fill: #64748b;
      }
      .state-body {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        fill: #334155;
      }
      .guard-text {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      .transition-action {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 9px;
        fill: #64748b;
      }
      .legend-text {
        font-family: 'Geist Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        fill: #475569;
      }
    </style>
    <marker id="ar-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <pattern id="dot-grid-state" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#dot-grid-state)" opacity="0.6"/>

  <!-- ================= TRANSITIONS ================= -->
  <!-- Start Node [*] to PENDING -->
  <path d="M 80 180 L 160 180" fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#ar-def)"/>
  <rect x="85" y="152" width="70" height="18" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="165" text-anchor="middle" class="guard-text" fill="#475569">POST report</text>

  <!-- PENDING -> IN_PROGRESS -->
  <path d="M 400 180 L 480 180" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#ar-blue)"/>
  <rect x="408" y="148" width="65" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="160" text-anchor="middle" class="guard-text" fill="#0284c7">[VERIFY]</text>
  <text x="440" y="170" text-anchor="middle" class="transition-action">Dispatch team</text>

  <!-- IN_PROGRESS -> COMPLETED -->
  <path d="M 720 180 L 800 180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="728" y="148" width="65" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="760" y="160" text-anchor="middle" class="guard-text" fill="#059669">[CLEANED]</text>
  <text x="760" y="170" text-anchor="middle" class="transition-action">Set resolved_at</text>

  <!-- PENDING -> REJECTED -->
  <path d="M 280 245 L 280 374 Q 280 380 286 380 L 510 380" fill="none" stroke="#e11d48" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#ar-rose)"/>
  <rect x="295" y="320" width="130" height="28" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="360" y="333" text-anchor="middle" class="guard-text" fill="#e11d48">[REJECT_PENDING]</text>
  <text x="360" y="344" text-anchor="middle" class="transition-action">Photo blur / duplicate</text>

  <!-- IN_PROGRESS -> REJECTED -->
  <path d="M 600 245 L 600 318" fill="none" stroke="#e11d48" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#ar-rose)"/>
  <rect x="545" y="265" width="110" height="28" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="600" y="278" text-anchor="middle" class="guard-text" fill="#e11d48">[ABORT_PROGRESS]</text>
  <text x="600" y="289" text-anchor="middle" class="transition-action">Waste not found / blocked</text>

  <!-- COMPLETED -> [*] Final -->
  <path d="M 940 245 L 940 330" fill="none" stroke="#059669" stroke-width="1.75" marker-end="url(#ar-green)"/>
  <rect x="910" y="270" width="60" height="18" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="940" y="283" text-anchor="middle" class="guard-text" fill="#059669">Archive</text>

  <!-- REJECTED -> [*] Final -->
  <path d="M 720 380 L 780 380" fill="none" stroke="#e11d48" stroke-width="1.75" marker-end="url(#ar-rose)"/>
  <rect x="730" y="362" width="40" height="16" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="750" y="374" text-anchor="middle" class="guard-text" fill="#e11d48">Close</text>

  <!-- ================= STATES ================= -->
  <!-- INITIAL PSEUDO-STATE [*] -->
  <g transform="translate(50, 166)">
    <circle cx="14" cy="14" r="12" fill="#0f172a" />
  </g>

  <!-- STATE 1: PENDING -->
  <g transform="translate(160, 115)">
    <rect width="240" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#fef3c7" />
    <rect y="24" width="240" height="8" fill="#fef3c7" />
    <circle cx="18" cy="16" r="4" fill="#d97706" />
    <text x="30" y="20" class="state-name" fill="#92400e">PENDING</text>
    <text x="180" y="20" class="state-sub">INITIAL STATUS</text>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#fde68a" stroke-width="1"/>

    <text x="14" y="52" class="state-body">• entry / lock GPS coordinates</text>
    <text x="14" y="70" class="state-body">• entry / run MobileNetV2 inference</text>
    <text x="14" y="88" class="state-body">• entry / insert into waste_reports</text>
    <text x="14" y="106" class="state-body">• exit / write initial report_log</text>
  </g>

  <!-- STATE 2: IN PROGRESS -->
  <g transform="translate(480, 115)">
    <rect width="240" height="130" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#e0f2fe" />
    <rect y="24" width="240" height="8" fill="#e0f2fe" />
    <circle cx="18" cy="16" r="4" fill="#0284c7" />
    <text x="30" y="20" class="state-name" fill="#0369a1">IN PROGRESS</text>
    <text x="175" y="20" class="state-sub">DISPATCHED</text>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#bae6fd" stroke-width="1"/>

    <text x="14" y="52" class="state-body">• entry / assign municipal truck</text>
    <text x="14" y="70" class="state-body">• entry / mandatory admin_notes</text>
    <text x="14" y="88" class="state-body">• do / field physical collection</text>
    <text x="14" y="106" class="state-body">• exit / audit transition in log</text>
  </g>

  <!-- STATE 3: COMPLETED [TERMINAL FOCAL] -->
  <g transform="translate(800, 115)">
    <rect width="240" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <rect width="240" height="32" rx="8" fill="#d1fae5" />
    <rect y="24" width="240" height="8" fill="#d1fae5" />
    <circle cx="18" cy="16" r="4" fill="#059669" />
    <text x="30" y="20" class="state-name" fill="#065f46">COMPLETED</text>
    <text x="155" y="20" class="state-sub" fill="#059669">TERMINAL (DONE)</text>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#a7f3d0" stroke-width="1"/>

    <text x="14" y="52" class="state-body">• entry / record resolved_at timestamp</text>
    <text x="14" y="70" class="state-body">• entry / increment resolution KPIs</text>
    <text x="14" y="88" class="state-body">• entry / close audit history</text>
    <text x="14" y="106" class="state-body" fill="#047857" font-weight="600">• immutable (no further updates)</text>
  </g>

  <!-- STATE 4: REJECTED [TERMINAL] -->
  <g transform="translate(510, 320)">
    <rect width="210" height="120" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" />
    <rect width="210" height="30" rx="8" fill="#ffe4e6" />
    <rect y="22" width="210" height="8" fill="#ffe4e6" />
    <circle cx="18" cy="15" r="4" fill="#e11d48" />
    <text x="30" y="20" class="state-name" fill="#9f1239">REJECTED</text>
    <text x="135" y="20" class="state-sub">TERMINAL</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#fecdd3" stroke-width="1"/>

    <text x="14" y="48" class="state-body">• entry / log rejection remarks</text>
    <text x="14" y="66" class="state-body">• entry / set actor_id audit</text>
    <text x="14" y="84" class="state-body">• notify / display reason to user</text>
    <text x="14" y="102" class="state-body" fill="#be123c" font-weight="600">• terminal state (locked)</text>
  </g>

  <!-- TERMINAL PSEUDO-STATE 1: COMPLETED FINAL -->
  <g transform="translate(926, 332)">
    <circle cx="14" cy="14" r="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <circle cx="14" cy="14" r="8" fill="#059669" />
  </g>

  <!-- TERMINAL PSEUDO-STATE 2: REJECTED FINAL -->
  <g transform="translate(782, 366)">
    <circle cx="14" cy="14" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <circle cx="14" cy="14" r="8" fill="#e11d48" />
  </g>

  <!-- ================= LEGEND STRIP ================= -->
  <g transform="translate(40, 505)">
    <rect x="0" y="0" width="980" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="20" cy="15" r="5" fill="#f59e0b"/>
    <text x="32" y="19" class="legend-text">Pending Triage</text>

    <circle cx="180" cy="15" r="5" fill="#0284c7"/>
    <text x="192" y="19" class="legend-text">In Progress (Active Dispatch)</text>

    <circle cx="430" cy="15" r="5" fill="#059669"/>
    <text x="442" y="19" class="legend-text">Completed (Terminal Success)</text>

    <circle cx="680" cy="15" r="5" fill="#e11d48"/>
    <text x="692" y="19" class="legend-text">Rejected (Terminal Abort)</text>

    <line x1="870" y1="15" x2="900" y2="15" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="910" y="19" class="legend-text">Guarded Transition</text>
  </g>
</svg>
